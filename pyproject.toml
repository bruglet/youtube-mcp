[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-mcp"
version = "0.1.0"
description = "Private Streamable HTTP MCP server for YouTube"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29.0,<2.0.0",
    "google-api-python-client>=2.0.0,<3.0.0",
    "youtube-transcript-api>=1.2.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "yt-dlp>=2025.1.0",
    "faster-whisper>=1.1.0,<2.0.0",
    "PyJWT[crypto]>=2.9.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
youtube-mcp = "youtube_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
